# Continuous integration: every push and pull request.
#
#   backend   API tests against a real PostgreSQL (as on Supabase)
#   aws       Lambda pipeline tests (moto), template freshness, cfn-lint
#   frontend  production build of the console (what Vercel deploys)
#   docker    both images build
name: CI

on:
  push:
    branches: [main, cloud-integrations]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plateletiq
          POSTGRES_PASSWORD: plateletiq
          POSTGRES_DB: plateletiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plateletiq"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: API tests (PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://plateletiq:plateletiq@localhost:5432/plateletiq_test
        run: python -m pytest -q
      - name: API tests (SQLite, the local default)
        working-directory: backend
        run: python -m pytest -q

  aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Rendered template is up to date
        run: python aws/build.py --check
      - name: cfn-lint
        run: cfn-lint aws/plateletiq-aws.yaml
      - name: SNS -> SQS -> Lambda -> DynamoDB -> report (moto)
        run: python -m pytest -q aws/tests -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://plateletiq-api.onrender.com/api/v1

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: plateletiq-api:ci
      - name: Console image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: plateletiq-web:ci
